[package]
name = "jsbm-dev"
version = "0.1.0"
description = "Benchmark storage and redirecting Cloudflare Worker for JSBenchmark.com"
license = "MIT-OR-Apache-2.0"
authors = ["Carter Himmel <me@fyko.net>"]
repository = "https://github.com/jsbenchmark/jsbm.dev"
edition = "2021"
rust-version = "1.91"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cfg-if = "1.0.5"
serde = "1.0.229"
worker = { version = "0.8.7", features = [
	"tokio-postgres",
	"d1",
] }
tokio-postgres = { version = "0.7.18", features = [
	'js',
], default-features = false }
wasm-bindgen = "0.2.129"
console_error_panic_hook = { version = "0.1.7", optional = true }
indoc = "2.0.7"
http = "1.5.0"
serde_json = "1.0.151"
base64 = "0.23.1"
time = { version = "0.3.55", features = ["wasm-bindgen"] }
serde_repr = "0.1.21"
rand = "0.10.3"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
